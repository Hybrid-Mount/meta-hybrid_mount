# SPDX-License-Identifier: GPL-3.0-only

name: Auto Blacklist PR / 自动黑名单 PR

on:
  issues:
    types: [opened, edited, reopened, labeled]

concurrency:
  group: blacklist-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-blacklist-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # GITHUB_TOKEN label events cannot trigger this; validate the form independently.
      - name: Validate blacklist request
        id: policy
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { acceptedBlacklistIssue } = require('./.github/scripts/issue-policy.cjs');
            const issue = await acceptedBlacklistIssue({ github, context });
            core.setOutput('accepted', Boolean(issue));
            if (issue) core.setOutput('module-id', issue.validatedModuleId);

      - name: Create blacklist PR
        if: steps.policy.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          MODULE_ID: ${{ steps.policy.outputs.module-id }}
        run: |
          set -euo pipefail

          echo "Validated module ID: $MODULE_ID"

          if ! echo "$MODULE_ID" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            gh issue comment "$ISSUE_NUM" --body "⚠️ Module ID \`$MODULE_ID\` has an invalid format. Module IDs may only contain letters, digits, dots, underscores, and hyphens. / 模块 ID 格式无效。"
            exit 1
          fi

          BRANCH="chore/blacklist-${MODULE_ID}-${ISSUE_NUM}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base dev --state all --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Skipping: blacklist PR already exists: $EXISTING_PR"
            exit 0
          fi

          git fetch origin dev
          git checkout -b "$BRANCH" origin/dev

          if grep -q "\"$MODULE_ID\"" module/module_blacklist.toml; then
            gh issue comment "$ISSUE_NUM" --body "✅ Module \`$MODULE_ID\` is already in the blacklist — no action needed. / 模块已在黑名单中，无需重复添加。"
            exit 0
          fi

          if grep -q 'blacklist = \[\]' module/module_blacklist.toml; then
            sed -i "s/blacklist = \[\]/blacklist = [\"$MODULE_ID\"]/" module/module_blacklist.toml
          else
            sed -i "s/blacklist = \[/blacklist = [\"$MODULE_ID\", /" module/module_blacklist.toml
          fi

          echo "Updated module_blacklist.toml:"
          cat module/module_blacklist.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module/module_blacklist.toml
          git commit -m "chore(blacklist): add ${MODULE_ID}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(blacklist): add ${MODULE_ID}" \
            --body "Closes #${ISSUE_NUM}

          Auto-generated from blacklist request. / 由黑名单申请自动生成。" \
            --base dev)

          gh issue comment "$ISSUE_NUM" --body "✅ PR created: ${PR_URL} / 已创建 PR: ${PR_URL}"
