# SPDX-License-Identifier: GPL-3.0-only
name: Sync to AtomGit

on:
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-atomgit
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Hybrid-Mount/meta-hybrid_mount'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync branches and tags
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_USERNAME: YuzakiKokuban
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ATOMGIT_TOKEN" ]]; then
            echo '::error::Configure the ATOMGIT_TOKEN repository secret first.'
            exit 1
          fi
          # Fetch current refs even when an older queued event starts this run.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git remote add atomgit https://atomgit.com/YuzakiKokuban/meta-hybrid_mount.git
          ASKPASS_PATH=$(mktemp)
          trap 'rm -f "$ASKPASS_PATH"' EXIT
          cat > "$ASKPASS_PATH" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$ATOMGIT_USERNAME" ;;
            *Password*) printf '%s\n' "$ATOMGIT_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$ASKPASS_PATH"
          export GIT_ASKPASS="$ASKPASS_PATH" GIT_TERMINAL_PROMPT=0
          # No force or pruning: preserve AtomGit-only refs and reject divergence.
          refspecs=('refs/tags/*:refs/tags/*')
          while IFS= read -r ref; do
            [[ "$ref" == refs/remotes/origin/HEAD ]] && continue
            refspecs+=("$ref:refs/heads/${ref#refs/remotes/origin/}")
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          git push atomgit "${refspecs[@]}"
