# SPDX-License-Identifier: GPL-3.0-only

name: lints-check

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lints:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Mount rollback tests need private namespaces and tmpfs mounts.
      options: --cap-add SYS_ADMIN
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Gate banned symbols
        run: |
          set -euo pipefail
          if grep -Rni "kasumi" src webui/src module xtask tools 2>/dev/null; then
            echo "banned symbol 'kasumi' found"
            exit 1
          fi
          if grep -Rn "normalize_symlinked_partition_layout\|normalize_module_layout" src module xtask 2>/dev/null; then
            echo "banned normalization logic found"
            exit 1
          fi

      - name: Verify bundled LKM provenance assets
        run: |
          set -euo pipefail
          test -f module/lkm/src/LICENSE
          test -f module/lkm/src/Kconfig
          test -f module/lkm/src/Makefile
          test -f module/lkm/README.md
          grep -q "GPL-2.0-only" module/lkm/README.md
          grep -q "SPDX-License-Identifier: GPL-2.0-only" module/lkm/src/nuke.c
          (cd module/lkm/binaries && sha256sum --check list.txt)

      - name: Verify VFS source and prebuilt provenance assets
        run: |
          set -euo pipefail
          test -f module/vfs/src/LICENSE
          test -f module/vfs/src/Kconfig
          test -f module/vfs/src/Makefile
          test -f module/vfs/src/PROVENANCE
          test -f module/vfs/README.md
          test -f module/vfs/setup.sh
          # The Hybrid Mount VFS module is GPL-2.0-only: the SPDX headers, the license text and the module
          # declaration must all say so.
          grep -q "GPL-2.0-only" module/vfs/README.md
          grep -q 'SPDX-License-Identifier: GPL-2.0-only' module/vfs/src/Makefile
          grep -q 'SPDX-License-Identifier: GPL-2.0-only' module/vfs/src/Kconfig
          grep -q 'SPDX-License-Identifier: GPL-2.0-only' module/vfs/src/hybridmount.c
          grep -q 'SPDX-License-Identifier: GPL-2.0-only' module/vfs/src/hybridmount.h
          grep -q 'MODULE_LICENSE("GPL v2")' module/vfs/src/hybridmount.c
          grep -q 'MODULE_AUTHOR("maxsteeel")' module/vfs/src/hybridmount.c
          ! grep -q "Version 3" module/vfs/src/LICENSE
          head -2 module/vfs/src/LICENSE | grep -q "Version 2"
          # The prebuilt modules ship with the package; when they are present their
          # digests must verify.
          if [ -d module/vfs/binaries ]; then
            test -f module/vfs/binaries/list.txt
            (cd module/vfs/binaries && sha256sum --check list.txt)
          fi

      - name: Verify prebuilt VFS modules still match their sources
        run: sh tests/shell/vfs_sources_digest.sh

      - name: ShellCheck module scripts
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends shellcheck
            rm -rf /var/lib/apt/lists/*
          fi
          # module/vfs/setup.sh is not matched by module/*.sh, so name it explicitly.
          shellcheck module/*.sh module/vfs/setup.sh tests/shell/*.sh

      - name: Test VFS built-in integration script
        run: sh tests/shell/vfs_setup.sh

      - name: Test the VFS sources digest checker
        run: sh tests/shell/vfs_sources_digest_test.sh

      - name: Test installer platform split
        run: sh tests/shell/customize_lkm.sh

      - name: Test boot lock consistency
        run: sh tests/shell/boot_lock.sh

  android-target-checks:
    name: Android check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
          cache-on-failure: true

      - name: Check Android target
        run: |
          rustup target add "${{ matrix.target }}" --toolchain nightly
          cargo check -p hybrid-mount --target "${{ matrix.target }}"

  webui-lints:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: webui
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "tree:0"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          set -euo pipefail
          STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$STORE_PATH"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint, test and build
        run: |
          set -uo pipefail
          pnpm lint &
          lint_pid=$!
          pnpm test &
          test_pid=$!
          pnpm build &
          build_pid=$!

          status=0
          for pid in "$lint_pid" "$test_pid" "$build_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"
