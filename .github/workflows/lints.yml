name: lints-check
on:
  pull_request:
    branches:
      - 'main'
      - 'dev'
  push:
    branches:
      - 'main'
      - 'dev'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci@sha256:7331b8850e117a6d534de2fc9c9bdb6d6845fd6f280aa9b3ffbbd6fc5d7c31a1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: 'tree:0'
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format codes
        run: cargo fmt --all -- --check
      - name: Clippy code
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run unit tests
        run: cargo test --workspace --all-features
      - name: Check lite feature set
        run: cargo test -p hybrid-mount --no-default-features --features control-plane --lib
      - name: Check nano feature set
        run: cargo test -p hybrid-mount --no-default-features --lib
      - name: Check installer compatibility
        run: bash tests/installer_compat.sh
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
          rm -rf /var/lib/apt/lists/*
          shellcheck --version
      - name: Lint shell scripts
        run: shellcheck --severity=error module/*.sh scripts/*.sh tests/*.sh

  webui-lints:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci@sha256:7331b8850e117a6d534de2fc9c9bdb6d6845fd6f280aa9b3ffbbd6fc5d7c31a1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: 'tree:0'
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$STORE_PATH"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate constants
        run: |
          cat <<'EOF' > src/lib/constants_gen.ts
          export const APP_VERSION = "dev";
          export const IS_RELEASE = false;
          export const RUST_PATHS = {
            CONFIG: "/data/adb/hybrid-mount/config.toml",
            DAEMON_STATE: "/data/adb/hybrid-mount/run/daemon_state.json",
            BINARY: "/data/adb/modules/hybrid_mount/hybrid-mount",
          } as const;
          EOF
      - name: Run lint
        run: pnpm lint
      - name: Run test
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --audit-level high
