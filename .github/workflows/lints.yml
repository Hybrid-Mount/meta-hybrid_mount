name: lints-check

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lints:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Android target checks
        run: |
          set -euo pipefail
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            --toolchain nightly
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo check -p hybrid-mount --target "$target"
          done

      - name: Gate banned symbols
        run: |
          set -euo pipefail
          if grep -Rni "kasumi" src webui/src module xtask tools 2>/dev/null; then
            echo "banned symbol 'kasumi' found"
            exit 1
          fi
          if grep -Rn "normalize_symlinked_partition_layout\|normalize_module_layout" src module xtask 2>/dev/null; then
            echo "banned normalization logic found"
            exit 1
          fi

      - name: ShellCheck module scripts
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends shellcheck
            rm -rf /var/lib/apt/lists/*
          fi
          shellcheck module/*.sh

  webui-lints:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: webui
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          filter: "tree:0"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: |
          set -euo pipefail
          STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$STORE_PATH"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck tests
        run: pnpm test

      - name: Build
        run: pnpm build
