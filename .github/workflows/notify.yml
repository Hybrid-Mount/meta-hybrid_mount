name: Notify crate

on:
  pull_request:
    branches:
      - 'main'
      - 'dev'
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tools/notify/**'
      - '.github/workflows/notify.yml'
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tools/notify/**'
      - '.github/workflows/notify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notify:
    name: Notify crate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci@sha256:7331b8850e117a6d534de2fc9c9bdb6d6845fd6f280aa9b3ffbbd6fc5d7c31a1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format notify crate
        run: cargo fmt --manifest-path tools/notify/Cargo.toml -- --check

      - name: Clippy notify crate
        run: cargo clippy --locked -p notify --all-targets -- -D warnings

      - name: Test notify crate
        run: cargo test --locked -p notify --all-targets
