name: Validate and Label Issues

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: issue-template-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Only execute policy code from the default branch, never an issue-supplied ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v9
        with:
          script: |
            const { enforceIssuePolicy } = require('./.github/scripts/issue-policy.cjs');
            await enforceIssuePolicy({ github, context, core });
