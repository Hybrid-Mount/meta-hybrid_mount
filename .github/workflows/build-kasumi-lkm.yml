name: Build LKM for Kasumi

on:
  workflow_call:
    inputs:
      full_archs:
        description: "Reserved input; DDK workflow currently builds arm64 only"
        required: false
        default: false
        type: boolean
      kasumi_ref:
        description: "Kasumi git ref (branch/tag/commit)"
        required: false
        default: "main"
        type: string
      ddk_release:
        description: "DDK release version"
        required: false
        default: "20251104"
        type: string
  workflow_dispatch:
    inputs:
      full_archs:
        description: "Reserved input; DDK workflow currently builds arm64 only"
        required: false
        default: false
        type: boolean
      kasumi_ref:
        description: "Kasumi git ref (branch/tag/commit)"
        required: false
        default: "main"
        type: string
      ddk_release:
        description: "DDK release version"
        required: false
        default: "20251104"
        type: string

jobs:
  export-kasumi-uapi:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve Kasumi UAPI
        id: resolve
        run: |
          set -euo pipefail

          git init kasumi_src
          (
            cd kasumi_src
            git remote add origin "https://github.com/Anatdx/Kasumi.git"
            git fetch --depth 1 origin "${{ inputs.kasumi_ref }}"
            git checkout FETCH_HEAD
            SHA="$(git rev-parse HEAD)"
            test -s src/include/kasumi_uapi.h
            cp src/include/kasumi_uapi.h "$GITHUB_WORKSPACE/kasumi_uapi.h"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Resolved Kasumi to $SHA"
          )
          sha256sum kasumi_uapi.h

      - name: Upload Kasumi UAPI
        uses: actions/upload-artifact@v7
        with:
          name: kasumi-uapi
          path: kasumi_uapi.h

  build-kasumi-lkm:
    needs: export-kasumi-uapi
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
        arch:
          - arm64
    uses: ./.github/workflows/kasumi-lkm.yml
    secrets: inherit
    with:
      kmi: ${{ matrix.kmi }}
      arch: ${{ matrix.arch }}
      kasumi_ref: ${{ needs.export-kasumi-uapi.outputs.sha }}
      ddk_release: ${{ inputs.ddk_release }}
