# ReHybrid-Mount
#
# SPDX-License-Identifier: GPL-3.0-only

name: Build ReHybrid-Mount

on:
  push:
    branches: ["rehybrid-mount"]
    paths:
      - "src/**"
      - "Cargo.*"
      - "module/**"
      - "webui"
      - "webui/**"
      - "xtask/**"
      - "build.rs"
      - "tools/notify/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["rehybrid-mount"]
    paths:
      - "src/**"
      - "Cargo.*"
      - "module/**"
      - "webui"
      - "webui/**"
      - "xtask/**"
      - "build.rs"
      - "tools/notify/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build package
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --ci

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          ARTIFACT_NAME="${ZIP_FILENAME%.*}"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          compression-level: 0
          if-no-files-found: error

  notify:
    needs: build
    if: github.event_name != 'pull_request'
    name: Notify packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: notify-output
          pattern: Hybrid-Mount-*
          merge-multiple: true

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          cargo xtask notify \
            --output notify-output \
            --label "日常耕作 🌱 (Daily Tilling) - ${{ github.ref_name }}" \
            --topic-id 37
