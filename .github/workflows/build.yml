name: Build Hybrid-Mount

on:
  push:
    branches:
      - 'dev'
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'module/**'
      - 'webui'
      - 'webui/**'
      - 'xtask/**'
      - 'build.rs'
      - 'scripts/build-local.sh'
      - 'tools/notify/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - 'dev'
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'module/**'
      - 'webui'
      - 'webui/**'
      - 'xtask/**'
      - 'build.rs'
      - 'scripts/build-local.sh'
      - 'tools/notify/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, nano]
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build ${{ matrix.flavor }}
        env:
          HYBRID_MOUNT_NOTIFY: "0"
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --ci --flavor ${{ matrix.flavor }}

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          ARTIFACT_NAME="${ZIP_FILENAME%.*}"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Verify ${{ matrix.flavor }} package contents
        run: |
          set -euo pipefail
          ZIP_PATH="$ARTIFACT_ZIP"
          test -n "$ZIP_PATH"
          unzip -tq "$ZIP_PATH"
          ENTRIES="$(unzip -Z1 "$ZIP_PATH")"
          for required in module.prop config.toml customize.sh binaries/hybrid-mount; do
            if ! grep -Fxq "$required" <<<"$ENTRIES"; then
              echo "package is missing required entry: $required" >&2
              exit 1
            fi
          done
          case "${{ matrix.flavor }}" in
          lite)
            for required in launcher.png webroot/index.html; do
              if ! grep -Fxq "$required" <<<"$ENTRIES"; then
                echo "lite package is missing required entry: $required" >&2
                exit 1
              fi
            done
            ;;
          nano)
            if grep -Fxq ".nano" <<<"$ENTRIES" \
              && ! grep -Eq '^(webroot/|webroot$|launcher\.png$)' <<<"$ENTRIES"; then
              :
            else
              echo "nano package must contain .nano and must not contain webroot/ or launcher.png" >&2
              exit 1
            fi
            ;;
          esac
          echo "package archive verified"

      - name: Upload ${{ matrix.flavor }} Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          compression-level: 0
          if-no-files-found: error

  notify:
    needs: build
    if: github.event_name != 'pull_request'
    name: Notify packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: notify-output
          pattern: Hybrid-Mount-*
          merge-multiple: true

      - name: Notify Telegram album
        env:
          HYBRID_MOUNT_NOTIFY: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find notify-output -maxdepth 1 -type f -name '*.zip' | sort)
          if [ "${#ZIP_FILES[@]}" -ne 2 ]; then
            echo "Expected 2 package artifacts, found ${#ZIP_FILES[@]}:"
            find notify-output -maxdepth 2 -type f -print | sort
            exit 1
          fi
          cargo xtask notify \
            --output notify-output \
            --label "日常耕作 🌱 (Daily Tilling) [lite+nano] - ${{ github.ref_name }}" \
            --topic-id 37
