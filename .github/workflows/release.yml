name: Release Hybrid Mount

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  # A release publishes a GitHub release and then pushes a version-sync commit back to dev.
  # Runs are therefore queued instead of replaced: cancelling one halfway can leave the
  # published release and the development branch disagreeing about the current version.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # lints.yml sets this workflow-wide, and Swatinem/rust-cache folds every matching environment
  # variable into its cache key (the default env-vars list matches the CARGO prefix). Without it
  # this workflow computes a different toolchain hash than lints.yml, so it could never restore
  # the rust-lints cache below — the only Rust cache the default branch ever publishes.
  CARGO_TERM_COLOR: always

jobs:
  notify-tool:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-tool.yml

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      version_code: ${{ steps.release_version.outputs.version_code }}
      prerelease: ${{ steps.release_version.outputs.prerelease }}
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        # Restored before anything compiles, so `Resolve the release tag` and the four-architecture
        # `cargo xtask build --release` below reuse a previous run's artifacts instead of building
        # the whole release profile from scratch.
        #
        # `shared-key` replaces the automatic job-based key, and `build` is build.yml's job id. That
        # workflow now also runs on `main`, and a tag run may only restore caches created on its own
        # ref or on the default branch — so its entry is the one cache a release can actually see.
        # lints.yml's `rust-lints` cache cannot serve this job: it only ever holds `cargo check` and
        # clippy artifacts, and release-profile codegen cannot be derived from check metadata.
        #
        # The key folds in the environment, so build.yml, lints.yml and this workflow must all keep
        # `CARGO_TERM_COLOR: always`; a divergence silently turns every restore into a miss. It also
        # normalises every workspace `package.version` to 0.0.0 before hashing, so the version `sed`
        # applied later in this job does not change the key.
        #
        # Restore-only: the action's save step returns before both the cleanup and the save unless
        # `save-if` is exactly "true". A tag ref is immutable and belongs to a single release, so an
        # entry written here could only ever be read by a rerun of that same run, while it costs
        # ~300 MB of the shared 10 GB cache budget every dev build competes for. The three
        # tag-scoped entries already in the repository are exactly that: written once, never
        # restored. Removing `save-if` is all it takes to make tag reruns warm again.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-all-crates: true
          save-if: "false"

      - name: Resolve pnpm store path
        id: pnpm-store
        working-directory: webui
        # The WebUI dependency tree is not part of any Rust cache, and this workflow had no pnpm
        # cache at all, so every release re-downloaded it inside `cargo xtask build`. The key is the
        # one lints.yml's webui-lints job publishes on the default branch, so a tag run restores it
        # straight away.
        run: |
          set -euo pipefail
          STORE_PATH="$(pnpm store path --silent)"
          mkdir -p "$STORE_PATH"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        # Restore-only, like every other cache on a tag ref: if the lockfile has moved on since the
        # default branch published this key, an exact miss would otherwise leave a saving action
        # writing a ~100 MB entry that only a rerun of this same run could ever read.
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Resolve Rust toolchain identity
        id: rust-toolchain
        # Mirrors build.yml. `rust-toolchain.toml` pins the `nightly` channel rather than a date, so
        # the compiler the CI image carries can change with no repository change at all — and the
        # riscv64 sysroot below is only valid for one exact rustc.
        run: |
          set -euo pipefail
          echo "id=$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the riscv64 sysroot
        # The same key build.yml writes on `main`, and restore-only. riscv64 has no prebuilt std, so
        # without this the release compiles `core`, `std`, `alloc`, `panic_abort` and
        # `compiler_builtins` from source on every tag (58 s in run 36726042842, against 12-14 s for
        # each of the other three targets). Swatinem/rust-cache cannot carry those artifacts — its
        # save step keeps only crates that appear as packages in `cargo metadata` — hence a cache of
        # its own. There is deliberately no save step in this workflow: an entry written on a tag ref
        # would be ~300 MB of dead budget, readable only by a rerun of this very run.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: target/riscv64-linux-android
          key: riscv64-sysroot-${{ runner.os }}-${{ steps.rust-toolchain.outputs.id }}-${{ hashFiles('Cargo.lock', 'xtask/src/main.rs') }}
          restore-keys: |
            riscv64-sysroot-${{ runner.os }}-${{ steps.rust-toolchain.outputs.id }}-

      - name: Resolve the release tag
        # Every version fact the release needs comes from here: the version injected into
        # Cargo.toml and module.prop, the versionCode published in update.json, and whether the
        # release is a pre-release. Deriving them in one place is what keeps them in step, and it
        # validates the tag as semver before any build work — a tag Cargo would reject fails here,
        # while it is still just a failed run, rather than after the release is public.
        id: release_version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo xtask release-version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Verify the prebuilt VFS modules match their sources
        # The zip contains both the kernel sources and the modules built from them, so a stale
        # .ko would ship behaviour the bundled source does not describe. A tag can be created
        # from any commit, including one where the sources moved on after the last rebuild, so
        # this is checked here rather than trusted from the branch history.
        run: sh tests/shell/vfs_sources_digest.sh

      - name: Apply tag version to package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" Cargo.toml
          grep -q "^version = \"$RELEASE_VERSION\"$" Cargo.toml
          echo "building package version $RELEASE_VERSION from tag $RELEASE_TAG"

      - name: Build release package
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --release

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          STAGED_ZIP="/tmp/$ZIP_FILENAME"
          cp "$ZIP_PATH" "$STAGED_ZIP"
          echo "STAGED_ZIP=$STAGED_ZIP" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ env.STAGED_ZIP }}
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [build, notify-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: read
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      # Resolved once by the build job, from the tag, by the same code that versions the package.
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        # update-json still uses the host xtask cache; notifications use a prebuilt binary.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lints
          cache-all-crates: true
          save-if: "false"

      - name: Download prebuilt notification tool
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.notify-tool.outputs.artifact-id }}
          run-id: ${{ needs.notify-tool.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/notify-tool
          merge-multiple: true

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package
          merge-multiple: true

      - name: Resolve package path
        id: paths
        run: |
          set -euo pipefail
          ZIP="$(find packages -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP" && test -s "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ZIP" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current
          github_token: ${{ github.token }}
        env:
          OUTPUT: /tmp/changelog.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Precheck release package
        # The official action normally renames assets. Use it only for validation;
        # its broad precheck pattern accepts the generated validator filename.
        uses: KernelSU-Modules/tools/actions/module-release@ca1187c92135b3c31e48d37e008d61153120a08b
        if: startsWith(github.ref, 'refs/tags/')
        with:
          zip: ${{ steps.paths.outputs.zip }}
          prerelease: ${{ env.PRERELEASE }}
          asset-pattern: "*.zip"
          dry-run: true

      - name: Upload release draft
        id: release-draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ steps.paths.outputs.zip }}
          body_path: /tmp/changelog.md
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish and verify immutable release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_ID: ${{ steps.release-draft.outputs.id }}
          ZIP_NAME: ${{ steps.paths.outputs.name }}
          ZIP_SHA256: ${{ steps.paths.outputs.sha256 }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const { data: draft } = await github.rest.repos.getRelease({ owner, repo, release_id });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            if (!draft.draft || draft.tag_name !== context.ref.replace('refs/tags/', '')) {
              throw new Error('Expected a draft for the current release tag; refusing to publish');
            }
            if (assets.length !== 1 || assets[0].name !== process.env.ZIP_NAME || assets[0].state !== 'uploaded') {
              throw new Error('Expected exactly one uploaded module ZIP with its original filename');
            }
            if (assets[0].digest !== `sha256:${process.env.ZIP_SHA256}`) {
              throw new Error('Uploaded ZIP digest differs from the validated package');
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false });
            // GitHub can briefly lag when exposing immutable after publication.
            let published;
            for (let attempt = 0; attempt < 3; attempt++) {
              if (attempt > 0) await new Promise(resolve => setTimeout(resolve, 2000));
              ({ data: published } = await github.rest.repos.getRelease({ owner, repo, release_id }));
              if (!published.draft && published.immutable === true) break;
            }
            if (published.draft || published.immutable !== true) {
              throw new Error('Published release is not immutable; check repository settings');
            }
            core.info(`Published immutable ${published.tag_name}: ${assets[0].name}`);

      - name: Prepare release metadata
        # Needs the tag-derived versionCode, which only exists for a tag: a manual dispatch builds
        # and notifies without publishing, so there is no metadata to prepare.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ZIP_NAME: ${{ steps.paths.outputs.name }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"

          # Use the original package filename, which was verified before publishing.
          # Reuse the xtask serializer so the release metadata and the local
          # `cargo xtask update-json` path cannot drift apart.
          cargo xtask update-json \
            "$TAG" \
            "$VERSION_CODE" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME"
          cp update.json /tmp/update.json

      - name: Sync version back to dev
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev

          mv /tmp/update.json update.json
          cat /tmp/changelog.md | cat - changelog.md > temp && mv temp changelog.md

          # The same semver-checked version the package was built with, so a tag that Cargo would
          # reject can never be written back to the development branch.
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" Cargo.toml
          grep -q "^version = \"$RELEASE_VERSION\"$" Cargo.toml
          cargo update

          git add update.json changelog.md Cargo.toml Cargo.lock

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): sync version ${{ github.ref_name }} [skip ci]"
            git push origin dev
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/notify-tool" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/notify-tool/hybrid-mount-notify"
          NOTIFY_DIR="/tmp/hybrid-mount-release-notify"
          rm -rf "$NOTIFY_DIR"
          mkdir -p "$NOTIFY_DIR"
          cp "${{ steps.paths.outputs.zip }}" "$NOTIFY_DIR/"
          "$RUNNER_TEMP/notify-tool/hybrid-mount-notify" \
            --output "$NOTIFY_DIR" \
            --label "丰收 (Harvest) - ${{ github.ref_name }}" \
            --topic-id 6
