name: Release Hybrid Mount

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      version_code: ${{ steps.release_version.outputs.version_code }}
      prerelease: ${{ steps.release_version.outputs.prerelease }}
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: "tree:0"

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve the release tag
        # Every version fact the release needs comes from here: the version injected into
        # Cargo.toml and module.prop, the versionCode published in update.json, and whether the
        # release is a pre-release. Deriving them in one place is what keeps them in step, and it
        # validates the tag as semver before any build work — a tag Cargo would reject fails here,
        # while it is still just a failed run, rather than after the release is public.
        id: release_version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo xtask release-version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Verify the prebuilt VFS modules match their sources
        # The zip contains both the kernel sources and the modules built from them, so a stale
        # .ko would ship behaviour the bundled source does not describe. A tag can be created
        # from any commit, including one where the sources moved on after the last rebuild, so
        # this is checked here rather than trusted from the branch history.
        run: sh tests/shell/vfs_sources_digest.sh

      - name: Apply tag version to package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" Cargo.toml
          grep -q "^version = \"$RELEASE_VERSION\"$" Cargo.toml
          echo "building package version $RELEASE_VERSION from tag $RELEASE_TAG"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Build release package
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --release

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          STAGED_ZIP="/tmp/$ZIP_FILENAME"
          cp "$ZIP_PATH" "$STAGED_ZIP"
          echo "STAGED_ZIP=$STAGED_ZIP" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ env.STAGED_ZIP }}
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      # Resolved once by the build job, from the tag, by the same code that versions the package.
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package
          merge-multiple: true

      - name: Resolve package path
        id: paths
        run: |
          set -euo pipefail
          ZIP="$(find packages -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP" && test -s "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          NOTIFY_DIR="/tmp/hybrid-mount-release-notify"
          rm -rf "$NOTIFY_DIR"
          mkdir -p "$NOTIFY_DIR"
          cp "${{ steps.paths.outputs.zip }}" "$NOTIFY_DIR/"
          cargo xtask notify \
            --output "$NOTIFY_DIR" \
            --label "丰收 (Harvest) - ${{ github.ref_name }}" \
            --topic-id 6

      - name: Prepare release metadata
        # Needs the tag-derived versionCode, which only exists for a tag: a manual dispatch builds
        # and notifies without publishing, so there is no metadata to prepare.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ZIP_NAME="${{ steps.paths.outputs.name }}"

          # Reuse the xtask serializer so the release metadata and the local
          # `cargo xtask update-json` path cannot drift apart.
          cargo xtask update-json \
            "$TAG" \
            "$VERSION_CODE" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME"
          cp update.json /tmp/update.json

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current
          github_token: ${{ github.token }}
        env:
          OUTPUT: /tmp/changelog.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create local release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ steps.paths.outputs.zip }}
          body_path: /tmp/changelog.md

      - name: Create remote release (KernelSU-Modules-Repo)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          repo="KernelSU-Modules-Repo/hybrid_mount"
          tag="${{ github.ref_name }}"

          prerelease_flag=""
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$tag" \
            --repo "$repo" \
            --draft \
            $prerelease_flag \
            --title "$tag" \
            --notes-file /tmp/changelog.md \
            "${{ steps.paths.outputs.zip }}"

          gh release edit "$tag" \
            --repo "$repo" \
            --draft=false

      - name: Sync version back to dev
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev
          git checkout dev

          mv /tmp/update.json update.json
          cat /tmp/changelog.md | cat - changelog.md > temp && mv temp changelog.md

          # The same semver-checked version the package was built with, so a tag that Cargo would
          # reject can never be written back to the development branch.
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" Cargo.toml
          grep -q "^version = \"$RELEASE_VERSION\"$" Cargo.toml
          cargo update

          git add update.json changelog.md Cargo.toml Cargo.lock

          if ! git diff --staged --quiet; then
            git commit -m "chore(release): sync version ${{ github.ref_name }} [skip ci]"
            git push origin dev
          fi
