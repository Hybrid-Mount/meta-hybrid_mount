# SPDX-License-Identifier: GPL-3.0-only
#
# Compile-check the Hybrid Mount VFS kernel module (K2) for every DDK target.
#
# DDK (https://github.com/Ylarod/ddk) publishes one image per Android/GKI target
# with the matching kernel headers and Clang toolchain baked in, and exports
# KDIR/ARCH/LLVM for the module build. Compiled artifacts are intentionally not
# uploaded or committed while the upstream licence declaration remains unresolved.

name: Build VFS kernel module

on:
  push:
    branches:
      - "dev"
      # VFS experiment branch: not merged into dev yet. Remove this entry once the branch is merged or deleted.
      - "feat/nomount-vfs"
    paths:
      - "module/vfs/**"
      - ".github/workflows/kernel-module.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "module/vfs/**"
      - ".github/workflows/kernel-module.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    env:
      DDK_IMAGE: ghcr.io/ylarod/ddk
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the module with DDK
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/build -w /build \
            "${DDK_IMAGE}:${TARGET}" \
            make -C module/vfs/src

      - name: Verify the build output locally
        run: |
          test -s module/vfs/src/hybridmount.ko
          rm -f module/vfs/src/hybridmount.ko
