# SPDX-License-Identifier: GPL-3.0-only
#
# Build the Hybrid Mount VFS kernel module for every DDK target.
#
# DDK (https://github.com/Ylarod/ddk) publishes one image per Android/GKI target
# with the matching kernel headers and Clang toolchain baked in, and exports
# KDIR/ARCH/LLVM for the module build. The assembled modules land in
# module/vfs/binaries next to module/lkm/binaries, with the same list.txt digest
# file.
#
# A push to dev that changes the module sources rebuilds and commits the binaries by
# itself, so the shipped .ko files cannot drift behind the kernel sources they were
# built from. lints.yml re-checks that link from the other side, by comparing the
# recorded sources digest, and so still catches a drift that reached the branch by any
# other route. Run the workflow manually with commit_binaries=true to force a refresh.

name: Build VFS kernel module

on:
  push:
    branches:
      - "dev"
    paths:
      - "module/vfs/**"
      - ".github/workflows/kernel-module.yml"
  pull_request:
    branches: ["dev"]
    paths:
      - "module/vfs/**"
      - ".github/workflows/kernel-module.yml"
  workflow_dispatch:
    inputs:
      commit_binaries:
        description: "Commit the assembled module/vfs/binaries back to this branch"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    env:
      DDK_IMAGE: ghcr.io/ylarod/ddk
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the module with DDK
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/build -w /build \
            "${DDK_IMAGE}:${TARGET}" \
            make -C module/vfs/src

      - name: Stage the artifact
        run: |
          mkdir -p dist
          mv module/vfs/src/hybridmount.ko "dist/hybridmount-${TARGET}.ko"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: hybridmount-${{ matrix.target }}
          path: dist/*.ko
          if-no-files-found: error

  package-binaries:
    needs: build-module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble module/vfs/binaries
        run: |
          set -euo pipefail
          mkdir -p module/vfs/binaries
          find artifacts -name '*.ko' -exec cp -f {} module/vfs/binaries/ \;
          (cd module/vfs/binaries && sha256sum ./*.ko | sed 's|\./||' > list.txt)
          cat module/vfs/binaries/list.txt

      - name: Record the sources these modules were built from
        run: |
          set -euo pipefail
          # One digest over the build inputs, in a fixed order, so a later lint run can tell
          # whether the committed .ko files still correspond to the committed kernel sources.
          # Written here, in the job that actually compiles them, so it cannot be hand-edited
          # into agreement with a stale binary.
          (cd module/vfs/src && sha256sum hybridmount.c hybridmount.h Kconfig Makefile) \
            | sha256sum | cut -d' ' -f1 > module/vfs/binaries/sources.txt
          cat module/vfs/binaries/sources.txt

      - uses: actions/upload-artifact@v7
        with:
          name: vfs-binaries
          path: module/vfs/binaries/
          if-no-files-found: error

      - name: Verify the assembled digests
        run: (cd module/vfs/binaries && sha256sum --check list.txt)

      - name: Verify the modules match the sources digest
        run: sh tests/shell/vfs_sources_digest.sh

      - name: Commit the assembled binaries
        # A push to dev has to update them, or the package would carry the previous build; a
        # manual run only when asked. Parenthesised so the intent does not depend on how `&&`
        # and `||` associate.
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.commit_binaries)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/vfs/binaries
          if git diff --cached --quiet; then
            echo "module/vfs/binaries is already up to date"
            exit 0
          fi
          # Name the branch explicitly rather than relying on a local branch being checked out,
          # and refuse a tag ref, where committing build output would be wrong.
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "refusing to commit build output to a non-branch ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          # `[skip ci]` keeps this build output from re-triggering CI. A push made with the
          # default GITHUB_TOKEN does not start workflows anyway; the marker keeps that true
          # if the push token is ever changed to one that would, which is the case where this
          # commit would otherwise rebuild itself in a loop.
          git commit -m "chore(vfs): refresh the prebuilt hybridmount modules [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
