version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      crates-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # tgbot 0.47 serializes flattened multipart captions incorrectly at runtime.
      - dependency-name: "tgbot"
        versions: ["0.47.x"]

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      webui-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 currently aborts typescript-eslint before linting starts.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      actions:
        patterns: ["*"]
