version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      crates:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      webui-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/webui"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      webui-actions:
        patterns:
          - "*"
