version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      crates-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # tgbot is pinned exactly in tools/notify/Cargo.toml because 0.47 and 0.48
      # JSON-quote flattened multipart strings: a single-file upload then sends
      # parse_mode as '"HTML"' and Telegram answers `400 unsupported parse_mode`.
      # The wire-level tests in tools/notify/src/lib.rs are the gate for lifting
      # this; a bump that skips them breaks the release notification, not the build
      # alone. Naming the dependency with no `versions` ignores every update, so
      # the upgrade stays a deliberate, tested change. The previous `0.47.x` range
      # was what let 0.48 through.
      - dependency-name: "tgbot"

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      webui-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 currently aborts typescript-eslint before linting starts.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      actions:
        patterns: ["*"]
