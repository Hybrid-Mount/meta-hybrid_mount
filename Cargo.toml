[workspace]
members = ["xtask", "tools/notify"]
resolver = "2"

[package]
name = "hybrid-mount"
version = "4.2.0"
edition = "2024"
description = "Mount orchestration metamodule for KernelSU and APatch"
authors = ["Hybrid Mount Developers"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Hybrid-Mount/meta-hybrid_mount"

[package.metadata.hybrid_mount]
name = "Hybrid Mount"
update = "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/main/update.json"
lite_name = "Hybrid Mount Lite"
lite_update = "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/main/update-lite.json"
nano_name = "Hybrid Mount Nano"
nano_update = "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/main/update-nano.json"

[features]
default = ["kasumi", "control-plane"]
kasumi = ["control-plane"]
control-plane = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"], optional = true }
extattr = "1"
rustix = { version = "1.1", features = ["fs", "mount"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
walkdir = "2.5"
log = "0.4"
flate2 = "1.1"
fastrand = "2.4"
glob = "0.3"
tempfile = "3.27"
signal-hook = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = { version = "0.11.10", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
procfs = "0.18"
ksu = { git = "https://github.com/Tools-cx-app/ksu.git", rev = "0fcde904475466eb6433cca59727bac886b59e60", version = "0.2.0" }
loopdev = { git = "https://github.com/Hybrid-Mount/loopdev.git", rev = "cc19868eabc46d5900c7c3fe5410856449d60cb6", version = "0.5.0" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = true
panic = "abort"

[build-dependencies]
anyhow = "1"
bindgen = "0.72"
semver = "1"
serde = { version = "1.0", features = ["serde_derive"] }
toml = "1.1"
