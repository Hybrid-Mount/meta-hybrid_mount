# ReHybrid-Mount
#
# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "hybrid-mount"
version = "6.0.0"
edition = "2024"
description = "ReHybrid-Mount: from-scratch rebuild of Hybrid Mount for KernelSU"
license = "GPL-3.0-only"
repository = "https://github.com/Hybrid-Mount/meta-hybrid_mount"
publish = false

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
