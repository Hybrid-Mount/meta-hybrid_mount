# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = ["xtask", "tools/notify"]
resolver = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[package]
name = "hybrid-mount"
version = "6.1.0"
edition = "2024"
description = "Hybrid Mount: mixed OverlayFS and Magic Mount for KernelSU and APatch"
license = "GPL-3.0-only"
repository = "https://github.com/Hybrid-Mount/meta-hybrid_mount"
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ksu = { git = "https://github.com/Tools-cx-app/ksu.git", version = "0.2.0" }
loopdev = { git = "https://github.com/Hybrid-Mount/loopdev.git", version = "0.5.0" }
procfs = "0.18"
rustix = { version = "1.1.4", features = ["fs", "mount", "thread"] }
