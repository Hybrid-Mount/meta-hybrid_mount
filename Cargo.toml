# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = ["xtask", "tools/notify"]
resolver = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[package]
name = "hybrid-mount"
version = "6.2.3-rc.3"
edition = "2024"
description = "Hybrid Mount: mixed OverlayFS, Magic Mount, and VFS for KernelSU and APatch"
license = "GPL-3.0-only"
repository = "https://github.com/Hybrid-Mount/meta-hybrid_mount"
publish = false

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
hex = "0.4"
log = "0.4"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# Only `sys::fs::check_kernel_config` needs this, to read /proc/config.gz; the
# non-Unix stub takes no key, so a host build has no use for it.
flate2 = "1"
loopdev = { git = "https://github.com/Hybrid-Mount/loopdev.git", version = "0.5.0" }
procfs = "0.18"
rustix = { version = "1.1.4", features = ["fs", "mount", "thread"] }
libc = "0.2"

[profile.release]
# The four Android binaries are ~75% of the release zip, and they are the only copy
# of this code that leaves the repository, so they ship without the ELF symbol table.
# What it costs: 4.7 MiB across the four binaries, and about 0.7 MiB once the
# release zip deflates them. The conservative `debuginfo` setting would recover
# only 98 KiB of that, because these binaries carry no DWARF at all — the symbol
# table is the whole cost — so it buys nothing here.
strip = "symbols"
