[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fs_extra = "1.3"
semver = "1"
serde_json = "1.0"
toml = "1.1"
zip = { version = "9.0.1", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
tempfile = "3.27"
