[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fs_extra = "1.3"
hybrid-mount-notify = { package = "notify", path = "../tools/notify" }
semver = "1"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
toml = "1.1"
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27"
