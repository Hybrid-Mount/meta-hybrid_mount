# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "notify"
version = "0.1.0"
edition = "2024"
description = "Telegram notification helper for Hybrid Mount build artifacts"
authors = ["Hybrid Mount Developers"]
license = "GPL-3.0-only"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
# 0.48 JSON-quotes flattened multipart strings (parse_mode becomes '"HTML"').
# Keep pinned until a release passes the wire-level upload regression tests.
tgbot = "=0.48.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
tiny_http = "0.12"
